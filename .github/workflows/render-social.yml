name: Render social graphics

on:
  push:
    paths:
      - 'source/*.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Render SVG files to PNG
        run: |
          mkdir -p images
          for f in source/*.svg; do
            [ -e "$f" ] || continue
            name=$(basename "$f" .svg)
            rsvg-convert "$f" -o "images/${name}.png" -w 1200 -h 1200
          done
      - name: Commit rendered graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          if ! git diff --cached --quiet; then
            git commit -m "Render social graphics"
            git push
          fi
